<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Slot Machine</title>
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #f0f0f0;
            margin: 0;
            padding-bottom: 50px;
            text-align: center;
        }
        header {
            background-color: #2c3e50;
            padding: 30px 20px;
            border-bottom: 3px solid #f39c12;
        }
        h1 {
            color: #f1c40f;
            font-size: 2.5em;
            margin: 0;
        }
        /* Style Khusus Slot Page */
        .slot-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background-color: #242424;
            border: 5px solid #f1c40f;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
        }
        
        .slot-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .reel {
            background-color: #1a1a1a;
            border: 2px solid #333;
            padding: 10px;
            border-radius: 5px;
            font-size: 3em;
            width: 80px;
            height: 100px;
            line-height: 100px;
            color: #e74c3c; /* Warna simbol */
        }
        
        .lever {
            background-color: #e74c3c;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: default;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px #c0392b;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .back-button:hover {
            background-color: #2980b9;
        }
        footer {
            background-color: #000;
            color: #7f8c8d;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Visual Slot Machine 🎰</h1>
        <p>Hanya Tampilan Desain Statis</p>
    </header>

    <main>
        <div class="slot-container">
            <h3>Simulasi Hasil (Statis)</h3>
            <div class="slot-display">
                <div class="reel">🍒</div>
                <div class="reel">🍒</div>
                <div class="reel">⭐</div>
            </div>
            
            <div class="lever">
                TARIK TUAS (Visual Murni)
            </div>
            
            <p style="color: #f1c40f; margin-top: 25px;">Ini adalah visual murni dari Mesin Slot. Tidak ada fungsi putar atau skor.</p>
        </div>

        <a href="index.html" class="back-button">← Kembali ke Lobby</a>
    </main>

    <footer>
        <p>&copy; 2025 Proyek GitHub Pages - Simulasi Murni</p>
    </footer>

</body>
</html>
